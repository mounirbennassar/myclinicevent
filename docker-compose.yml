# Production stack: Postgres + FastAPI + Next.js behind Caddy (automatic HTTPS).
# 1. cp .env.example .env  and  cp backend/.env.example backend/.env  — fill both in.
# 2. docker compose up -d --build
# Only Caddy is exposed. The API is reachable solely through the Next.js /api proxy.

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: myclinic_events
      POSTGRES_USER: mce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mce -d myclinic_events"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: backend/.env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://mce:${POSTGRES_PASSWORD}@db:5432/myclinic_events
      COOKIE_SECURE: "true"
      PUBLIC_BASE_URL: https://${DOMAIN:?set DOMAIN in .env}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    environment:
      # Runtime: server-side fetches go to the API container; rewrites were baked in at build time.
      BACKEND_URL: http://backend:8000
      PUBLIC_BASE_URL: https://${DOMAIN}
    depends_on:
      - backend
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ALT_DOMAIN: ${ALT_DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
